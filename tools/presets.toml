# ------------------------------------------------------------------ 4. no paid subscription at all
[[preset]]
name = "budget-free"
label = "Free lanes only"
who = "No paid subscription, or trying the skeleton before paying. Free OpenCode models plus AGY."
cost = "$0 — but the free tiers are unpublished, shared and can vanish without notice"
notes = "HONEST LIMITS: free OpenCode ids are per account/device and stop without warning (429 or 'usage limit'); Space Bunny's free period is not permanent. AGY has no reliable quota meter. Re-probe before every launch and expect to slow down or stop when they are limited. Not suitable for a serious all-night run."

[[preset.producer_routes]]
name = "opencode-free"
title = "Producer OpenCode free"
agent = "opencode"
command = "opencode --model opencode/space-bunny-free"
limit_patterns = ["usage limit", "rate limit", "freetierror", "\\b429\\b"]
probe = '''opencode run -m opencode/space-bunny-free "Reply with exactly: ok"'''
probe_timeout = 90

[[preset.roster]]
name = "space-bunny"
title_prefix = "Bunny"
count = 2
command = "opencode --model opencode/space-bunny-free"

[[preset.roster]]
name = "muse"
title_prefix = "Muse"
count = 1
command = "opencode --model opencode/muse-spark-1.3-contributor-free"

[[preset.roster]]
name = "mimo"
title_prefix = "MiMo"
count = 1
command = "opencode --model opencode/mimo-v2.6-flash-free"

[[preset.roster]]
name = "agy"
title_prefix = "AGY"
count = 1
command = "agy --model gemini-3.8-flash-high --effort high --mode accept-edits --dangerously-skip-permissions"
