name: tests

on:
  push:
  pull_request:

jobs:
  tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Documentation points at things that exist
        run: python tools/doc_check.py
      - name: File tree matches work/agents/knowledge/STRUCTURE.md
        run: python tools/structure_check.py
      - name: Tool tests
        run: python -X utf8 -m pytest -q tools/tests -p no:cacheprovider
